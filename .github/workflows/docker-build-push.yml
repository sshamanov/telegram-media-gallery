name: Build and Push Hardened Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            USER_ID=1001
            GROUP_ID=1001
            VITE_TELEGRAM_API_ID=${{ secrets.VITE_TELEGRAM_API_ID }}
            VITE_TELEGRAM_API_HASH=${{ secrets.VITE_TELEGRAM_API_HASH }}

      - name: Run type check
        run: |
          docker run --rm --network host \
            -v "$(pwd)":/app -w /app \
            node:24-alpine npm run check

      - name: Install Playwright browsers
        run: |
          docker run --rm --network host \
            -v "$(pwd)":/app -w /app \
            node:24-alpine npm run test:install-browsers

      - name: Run short test suite
        run: |
          # Start dev server in background
          docker run --rm --network host \
            -v "$(pwd)":/app -w /app \
            -e VITE_USE_MOCK_ADAPTER=true \
            node:24-alpine npm run dev -- --host 0.0.0.0 --port 5173 &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 10
          
          # Run tests
          docker run --rm --network host \
            -v "$(pwd)":/app -w /app \
            -e VITE_USE_MOCK_ADAPTER=true \
            node:24-alpine npm run test:short || true
          
          # Kill dev server
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
