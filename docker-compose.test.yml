services:
  app:
    image: node:24-alpine
    working_dir: /app
    network_mode: host
    volumes:
      - .:/app
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      VITE_USE_MOCK_ADAPTER: "true"
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"

  playwright:
    image: mcr.microsoft.com/playwright:v1.59.1-jammy
    working_dir: /app
    network_mode: host
    volumes:
      - .:/app
    environment:
      PLAYWRIGHT_CONTAINER_MODE: "true"
      PLAYWRIGHT_BASE_URL: "https://localhost:5173"
    depends_on:
      - app
    command: >
      sh -c "
        echo 'Waiting for app server to be ready on port 5173...' &&
        timeout 60 bash -c 'until curl -k -s -f https://localhost:5173 > /dev/null; do sleep 2; done' &&
        echo 'App server is ready. Running tests...' &&
        npx playwright test --config=playwright.config.ts --grep \"@short\" --project=desktop-chrome
      "

  app-prod:
    image: node:24-alpine
    working_dir: /app
    network_mode: host
    volumes:
      - .:/app
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      VITE_USE_MOCK_ADAPTER: "true"
    command: sh -c "npm run build && npm run serve:dist -- --host 0.0.0.0 --port 5173"

  playwright-prod:
    image: mcr.microsoft.com/playwright:v1.59.1-jammy
    working_dir: /app
    network_mode: host
    volumes:
      - .:/app
    environment:
      PLAYWRIGHT_CONTAINER_MODE: "true"
      PLAYWRIGHT_SERVER_MODE: "production"
      PLAYWRIGHT_BASE_URL: "http://127.0.0.1:5173"
    depends_on:
      - app-prod
    command: >
      sh -c "
        echo 'Waiting for production preview server on port 5173...' &&
        timeout 60 bash -c 'until curl -s -f http://127.0.0.1:5173 > /dev/null; do sleep 2; done' &&
        echo 'Production preview is ready. Running offline shell test...' &&
        npx playwright test --config=playwright.config.ts tests/e2e/long/offline.spec.ts --project=desktop-chrome --reporter=line
      "
