services:
  app:
    image: node:20-alpine
    working_dir: /app
    network_mode: host
    volumes:
      - .:/app
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      VITE_USE_MOCK_ADAPTER: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    stdin_open: true
    tty: true

  playwright:
    image: mcr.microsoft.com/playwright:v1.59.1-jammy
    working_dir: /app
    network_mode: host
    volumes:
      - .:/app
    environment:
      # Disable webServer in playwright config for container mode
      PLAYWRIGHT_CONTAINER_MODE: "true"
      # Point to the app service running on host network
      PLAYWRIGHT_BASE_URL: "https://localhost:5173"
    depends_on:
      - app
    # Wait for app server to be ready on port 5173
    command: >
      sh -c "
        echo 'Waiting for app server to be ready on port 5173...' &&
        timeout 60 bash -c 'until curl -k -s -f https://localhost:5173 > /dev/null; do sleep 2; done' &&
        echo 'App server is ready. Running tests...' &&
        npx playwright test --config=playwright.config.ts --grep \"@short\" --project=desktop-chrome
      "
