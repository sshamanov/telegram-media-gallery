services:
  app:
    image: node:24-alpine
    working_dir: /app
    network_mode: host
    volumes:
      - .:/app
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      VITE_USE_MOCK_ADAPTER: "false"
      VITE_DEBUG_MEDIA_SIZES: "true"
      VITE_DEBUG_VIEWER: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    stdin_open: true
    tty: true
